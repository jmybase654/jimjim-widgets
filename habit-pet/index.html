<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Pet · 해빗이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      background: #ffffff;
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      color: #2b2b33;
    }

    .card {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      padding: 20px;
      background: #fffdf7;
      border: 2px solid #efe6d6;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name {
      font-family: 'Jua', sans-serif;
      font-size: 26px;
    }

    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e6f4ec;
      color: #1f5e3a;
    }

    .screen {
      position: relative;
      height: 240px;
      border-radius: 22px;
      background: #e6f4ec;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.06);
    }

    .pet svg { display: block; }
    .pet svg[hidden] { display: none; }

    .rate-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .rate-label { font-size: 13px; font-weight: 500; }

    .rate-value {
      font-family: 'Jua', sans-serif;
      font-size: 22px;
      color: #1f5e3a;
    }

    .bar {
      height: 12px;
      margin-top: 6px;
      border-radius: 999px;
      background: #eee8dc;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: #5fb283;
      transition: width 0.3s ease;
    }

    .steps {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 11px;
      color: #5e5e6b;
    }

    .inputs {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label { font-size: 13px; font-weight: 500; }

    .field input {
      height: 52px;
      width: 100%;
      border: 2px solid #e3d9c6;
      border-radius: 14px;
      background: #ffffff;
      text-align: center;
      font-family: 'Jua', sans-serif;
      font-size: 26px;
      color: #2b2b33;
      -moz-appearance: textfield;
    }

    .field input::-webkit-outer-spin-button,
    .field input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .field input:focus-visible {
      outline: 3px solid #81b7e7;
      outline-offset: 2px;
    }

    .slash {
      font-family: 'Jua', sans-serif;
      font-size: 28px;
      color: #8a847a;
      padding-bottom: 10px;
    }

    #note {
      margin: 0;
      min-height: 20px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      color: #5e5e6b;
    }

    #note.warn { color: #a33228; }
  </style>
</head>
<body>

    <div class="header">
      <span class="name">해빗이</span>
      <span class="badge" id="badge">씨앗 단계</span>
    </div>

    <div class="screen">
      <div class="bubble" id="bubble">오늘 할 일이 몇 개인지 알려 줘</div>
      <div class="pet" id="pet">

<svg width="180" height="180" data-stage="flower" hidden viewBox="0 0 160 160" role="img" aria-label="활짝 꽃 단계 해빗이가 커다란 꽃잎을 펼치고 활짝 웃고 있어요">
      <path d="M16 30 l3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 z" fill="#FF9F1C"/>

      </div>
    </div>

    <div>
      <div class="rate-row">
        <span class="rate-label">오늘 달성률</span>
        <span class="rate-value" id="percent">0%</span>
      </div>
      <div class="bar"><div class="bar-fill" id="bar"></div></div>
      <div class="steps"><span>씨앗</span><span>새싹</span><span>꽃봉오리</span><span>활짝 꽃</span></div>
    </div>

    <div class="inputs">
      <div class="field">
        <label for="done">완료한 일</label>
        <input id="done" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
      </div>
      <span class="slash" aria-hidden="true">/</span>
      <div class="field">
        <label for="total">오늘 할 일</label>
        <input id="total" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
      </div>
    </div>

    <p id="note" role="status">노션에서 체크한 개수를 그대로 적어 주세요</p>
  </main>

  <script>
    const doneInput = document.getElementById('done');
    const totalInput = document.getElementById('total');
    const badge = document.getElementById('badge');
    const bubble = document.getElementById('bubble');
    const percentText = document.getElementById('percent');
    const bar = document.getElementById('bar');
    const note = document.getElementById('note');
    const pets = document.querySelectorAll('#pet svg');

    // 날짜별로 기록해서, 새로운 날에는 처음부터 시작해요.
    function todayKey() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return 'habit-pet-' + d.getFullYear() + '-' + mm + '-' + dd;
    }

    function save() {
      try {
        localStorage.setItem(todayKey(), JSON.stringify({ done: doneInput.value, total: totalInput.value }));
      } catch (e) {
        // 저장이 막힌 환경에서도 화면은 그대로 작동해요.
      }
    }

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(todayKey()) || 'null');
        if (saved) {
          doneInput.value = saved.done ?? '';
          totalInput.value = saved.total ?? '';
        }
      } catch (e) {}
    }

    function showStage(stage) {
      pets.forEach(function (svg) {
        svg.hidden = svg.dataset.stage !== stage;
      });
    }

    function update() {
      const doneRaw = doneInput.value;
      const totalRaw = totalInput.value;
      const done = Number(doneRaw);
      const total = Number(totalRaw);

      const validTotal = totalRaw !== '' && Number.isInteger(total) && total > 0;
      const validDone = doneRaw === '' || (Number.isInteger(done) && done >= 0);

      let ratio = 0;
      note.className = '';
      note.textContent = '노션에서 체크한 개수를 그대로 적어 주세요';

      if (!validTotal || !validDone) {
        note.className = 'warn';
        note.textContent = !validTotal
          ? '오늘 할 일 개수를 1 이상으로 적어 주세요'
          : '완료한 일은 0 이상의 정수로 적어 주세요';
      } else if (done > total) {
        ratio = 1;
        note.className = 'warn';
        note.textContent = '완료한 일이 오늘 할 일보다 많아요';
      } else {
        ratio = (doneRaw === '' ? 0 : done) / total;
      }

      let stage = 'seed';
      let stageName = '씨앗';
      let msg = '오늘 할 일, 하나만 같이 해 볼까?';

      if (!validTotal) {
        msg = '오늘 할 일이 몇 개인지 알려 줘';
      } else if (ratio >= 1) {
        stage = 'flower'; stageName = '활짝 꽃'; msg = '오늘 할 일 다 끝! 최고야';
      } else if (ratio >= 0.5) {
        stage = 'bud'; stageName = '꽃봉오리'; msg = '거의 다 왔어, 조금만 더!';
      } else if (ratio > 0) {
        stage = 'sprout'; stageName = '새싹'; msg = '쑥쑥 자라는 중이야';
      }

      const percent = Math.round(ratio * 100);
      percentText.textContent = percent + '%';
      bar.style.width = percent + '%';
      badge.textContent = stageName + ' 단계';
      bubble.textContent = msg;
      showStage(stage);
    }

    doneInput.addEventListener('input', function () { update(); save(); });
    totalInput.addEventListener('input', function () { update(); save(); });

    load();
    update();
  </script>
</body>
</html>
