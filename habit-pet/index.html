<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Pet · 해빗이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px 12px 24px;
      background: #ffffff;
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      color: #2b2b33;
    }

    .card {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      padding: 22px 20px 20px;
      background: #fffcf6;
      border-radius: 32px;
      box-shadow: 0 1px 0 #efe6d6, 0 10px 30px rgba(120, 90, 60, 0.10);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 머리글 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 4px;
    }

    .date { display: block; font-size: 12px; font-weight: 500; color: #6b6458; }
    .name { display: block; font-family: 'Jua', sans-serif; font-size: 28px; line-height: 1; margin-top: 2px; }

    .badge {
      font-family: 'Jua', sans-serif;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #ffe3ec;
      color: #9c2a55;
    }

    /* 해빗이 화면 */
    .screen {
      position: relative;
      height: 236px;
      border-radius: 26px;
      background: #e4f3ea;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }

    .deco { position: absolute; background: #ffffff; opacity: 0.8; }
    .cloud1 { left: 26px; top: 64px; width: 44px; height: 16px; border-radius: 999px; }
    .cloud2 { left: 44px; top: 56px; width: 22px; height: 22px; border-radius: 50%; }
    .cloud3 { right: 30px; top: 92px; width: 34px; height: 12px; border-radius: 999px; }
    .hill { position: absolute; left: -30px; right: -30px; bottom: -70px; height: 110px; border-radius: 50%; background: #cdead6; }

    .bubble {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bubble-text {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(60, 110, 80, 0.10);
    }

    .bubble-tail {
      width: 12px;
      height: 12px;
      margin-top: -7px;
      background: #ffffff;
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .pet {
      position: relative;
      z-index: 2;
      margin-bottom: 4px;
      transform-origin: 50% 100%;
    }

    .pet svg { display: block; }
    .pet svg[hidden] { display: none; }

    /* 링 + 버튼 */
    .progress {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 2px 0;
    }

    @property --p {
      syntax: '<number>';
      inherits: false;
      initial-value: 0;
    }

    .ring {
      --p: 0;
      flex: 0 0 160px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: conic-gradient(#e0457f calc(var(--p) * 3.6deg), #f6e9ee 0deg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: --p 0.6s ease;
    }

    .ring-inner {
      width: 134px;
      height: 134px;
      border-radius: 50%;
      background: #fffcf6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .fraction { display: flex; align-items: baseline; }

    .fraction input {
      border: 0;
      background: transparent;
      font-family: 'Jua', sans-serif;
      padding: 0;
      -moz-appearance: textfield;
    }

    .fraction input::-webkit-outer-spin-button,
    .fraction input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* 숫자 칸: 눌러서 적을 수 있는 칸처럼 보이게 해요. */
    .fraction { align-items: center; gap: 5px; margin-top: 6px; }

    .field {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .fraction input {
      min-width: 0;
      height: 38px;
      border-radius: 12px;
      background: #f6e9ee;
      border: 2px solid transparent;
      text-align: center;
      color: #2b2b33;
    }

    #done { width: 40px; font-size: 23px; }
    #total { width: 40px; font-size: 23px; }

    #total::placeholder { color: #e0457f; opacity: 1; }

    /* 오늘 할 일이 비어 있으면 분홍 점선과 반짝임으로 알려 줘요. */
    #total.need {
      background: #ffffff;
      border: 2px dashed #e0457f;
      animation: glow 1.6s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(224, 69, 127, 0.35); }
      50% { box-shadow: 0 0 0 6px rgba(224, 69, 127, 0); }
    }

    .slash { font-family: 'Jua', sans-serif; font-size: 20px; color: #c9bfb0; margin-bottom: 18px; }

    .field label { font-size: 11px; font-weight: 500; color: #6b6458; }
    .field label.need { font-weight: 700; color: #b0245a; }

    .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .rate-label { display: block; font-size: 12px; font-weight: 500; color: #6b6458; }
    #percent { display: block; font-family: 'Jua', sans-serif; font-size: 34px; line-height: 1.1; color: #b0245a; }

    #complete {
      height: 52px;
      border: 0;
      border-radius: 18px;
      background: #e0457f;
      box-shadow: 0 4px 0 #a8285a;
      color: #ffffff;
      font-family: 'Jua', sans-serif;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #complete:disabled { opacity: 0.4; cursor: not-allowed; }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #81b7e7;
      outline-offset: 2px;
    }

    #note {
      margin: 0;
      min-height: 20px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      color: #5e5e6b;
    }

    #note.warn { color: #a33228; }
    #note.hint { color: #b0245a; font-weight: 700; }

    /* 지난 7일 정원 */
    .garden {
      background: #f7f1e7;
      border-radius: 24px;
      padding: 14px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .garden-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 4px;
    }

    .garden-title { font-family: 'Jua', sans-serif; font-size: 17px; }
    .garden-count { font-size: 12px; font-weight: 500; color: #6b6458; }

    .days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      align-items: end;
    }

    .day { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .day-pet { width: 44px; height: 46px; display: flex; align-items: flex-end; justify-content: center; }
    .day-pet svg { display: block; }
    .soil { width: 26px; height: 7px; margin-bottom: 3px; border-radius: 50%; background: #e2d5c4; }

    .day-label {
      font-size: 11px;
      font-weight: 500;
      color: #6b6458;
      padding: 1px 7px;
      border-radius: 999px;
    }

    .day.today .day-label { font-weight: 700; color: #ffffff; background: #e0457f; }

    /* 움직임 */
    @keyframes bounce {
      0% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(-18px) scale(0.96, 1.05); }
      55% { transform: translateY(0) scale(1.06, 0.94); }
      75% { transform: translateY(-5px) scale(1, 1); }
      100% { transform: translateY(0) scale(1, 1); }
    }
    .bounce { animation: bounce 0.6s ease; }

    @keyframes press {
      0% { transform: scale(1); }
      40% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    .press { animation: press 0.25s ease; }

    @keyframes pop {
      0% { transform: translateX(-50%) scale(0.85); }
      60% { transform: translateX(-50%) scale(1.06); }
      100% { transform: translateX(-50%) scale(1); }
    }
    .pop { animation: pop 0.35s ease; }

    @keyframes spark {
      0% { transform: scale(0) rotate(0); opacity: 0; }
      40% { transform: scale(1.3) rotate(20deg); opacity: 1; }
      100% { transform: scale(0.8) rotate(45deg); opacity: 0; }
    }
    .spark { position: absolute; z-index: 1; opacity: 0; animation: spark 1.4s ease forwards; }

    @keyframes fall {
      0% { transform: translateY(-30px) rotate(0); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(250px) rotate(320deg); opacity: 0; }
    }
    .petal {
      position: absolute;
      top: 0;
      z-index: 1;
      width: 12px;
      height: 16px;
      border-radius: 60% 60% 60% 0;
      opacity: 0;
      animation: fall 2.4s ease-in forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .bounce, .press, .pop, .spark, .petal, #total.need { animation: none; }
      .ring { transition: none; }
    }
  </style>
</head>

  <script>
    const doneInput = document.getElementById('done');
    const totalInput = document.getElementById('total');
    const completeButton = document.getElementById('complete');
    const badge = document.getElementById('badge');
    const bubble = document.getElementById('bubble');
    const bubbleText = document.getElementById('bubble-text');
    const ring = document.getElementById('ring');
    const percentText = document.getElementById('percent');
    const note = document.getElementById('note');
    const screen = document.getElementById('screen');
    const petBox = document.getElementById('pet');
    const pets = petBox.querySelectorAll('svg');
    const daysBox = document.getElementById('days');
    const gardenCount = document.getElementById('garden-count');

    const STAGE_NAMES = { seed: '씨앗', sprout: '새싹', bud: '꽃봉오리', flower: '활짝 꽃' };
    const STAGE_RANK = { seed: 0, sprout: 1, bud: 2, flower: 3 };
    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
    const LINES = {
      seed: ['오늘 할 일, 하나만 같이 해 볼까?', '음냐… 첫 번째 할 일로 깨워 줘', '씨앗은 준비됐어! 시작해 볼까?'],
      sprout: ['쑥쑥 자라는 중이야', '좋아, 그 기세 그대로!', '새싹이 고개를 들었어', '하나씩 하면 돼, 잘하고 있어'],
      bud: ['거의 다 왔어, 조금만 더!', '꽃봉오리가 몽글몽글해졌어', '반 넘게 해냈어, 대단해!', '곧 꽃이 필 것 같아'],
      flower: ['오늘 할 일 다 끝! 최고야', '활짝 폈다! 오늘 정말 멋졌어', '오늘의 나, 칭찬해!']
    };

    let currentStage = 'seed';
    let grewTimer = null;

    // ---------- 저장 (날짜별) ----------
    function dateKey(d) {
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return 'habit-pet-' + d.getFullYear() + '-' + mm + '-' + dd;
    }

    function readRecord(d) {
      try {
        return JSON.parse(localStorage.getItem(dateKey(d)) || 'null');
      } catch (e) {
        return null;
      }
    }

    function save() {
      try {
        localStorage.setItem(dateKey(new Date()), JSON.stringify({ done: doneInput.value, total: totalInput.value }));
      } catch (e) {
        // 저장이 막힌 환경에서도 화면은 그대로 작동해요.
      }
    }

    // ---------- 계산 ----------
    function calc(doneRaw, totalRaw) {
      const done = doneRaw === '' || doneRaw == null ? 0 : Number(doneRaw);
      const total = Number(totalRaw);
      const totalOk = totalRaw !== '' && totalRaw != null && Number.isInteger(total) && total > 0;
      const doneOk = Number.isInteger(done) && done >= 0;
      let ratio = 0;
      if (totalOk && doneOk) ratio = Math.min(1, done / total);
      let stage = 'seed';
      if (totalOk && doneOk) {
        if (ratio >= 1) stage = 'flower';
        else if (ratio >= 0.5) stage = 'bud';
        else if (ratio > 0) stage = 'sprout';
      }
      return { done: done, total: total, totalOk: totalOk, doneOk: doneOk, ratio: ratio, stage: stage };
    }

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // ---------- 움직임 ----------
    function replay(el, className) {
      el.classList.remove(className);
      void el.offsetWidth; // 애니메이션을 처음부터 다시 시작하게 해요.
      el.classList.add(className);
    }

    function sparkle() {
      const colors = ['#FF9F1C', '#5B8DEF', '#F0508A', '#FFC93C', '#4CC174', '#9C82E0'];
      const spots = [['18%', '30%'], ['74%', '24%'], ['10%', '62%'], ['82%', '58%'], ['30%', '14%'], ['62%', '10%']];
      spots.forEach(function (spot, i) {
        const size = i % 2 ? 18 : 26;
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'spark');
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        svg.style.left = spot[0];
        svg.style.top = spot[1];
        svg.style.animationDelay = (i * 0.08) + 's';
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z');
        path.setAttribute('fill', colors[i]);
        svg.appendChild(path);
        screen.appendChild(svg);
        setTimeout(function () { svg.remove(); }, 1800);
      });
    }

    function petalShower() {
      const colors = ['#FF8FB3', '#F0508A', '#FFC93C', '#FFB3C4'];
      for (let i = 0; i < 14; i++) {
        const petal = document.createElement('span');
        petal.className = 'petal';
        petal.setAttribute('aria-hidden', 'true');
        petal.style.left = (4 + i * 6.8) + '%';
        petal.style.background = colors[i % colors.length];
        petal.style.animationDelay = (((i * 37) % 9) * 0.12) + 's';
        screen.appendChild(petal);
        setTimeout(function () { petal.remove(); }, 3600);
      }
    }

    // ---------- 화면 그리기 ----------
    function showStage(stage) {
      pets.forEach(function (svg) {
        svg.toggleAttribute('hidden', svg.getAttribute('data-stage') !== stage);
      });
    }

    function renderGarden(todayStage, todayOk) {
      daysBox.textContent = '';
      const today = new Date();
      let fullDays = 0;

      for (let i = 6; i >= 0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
        const isToday = i === 0;
        let stage = null;

        if (isToday) {
          stage = todayOk ? todayStage : null;
        } else {
          const rec = readRecord(d);
          if (rec) {
            const c = calc(rec.done, rec.total);
            if (c.totalOk && c.doneOk) stage = c.stage;
          }
        }
        if (stage === 'flower') fullDays++;

        const day = document.createElement('div');
        day.className = 'day' + (isToday ? ' today' : '');
        day.setAttribute('role', 'img');
        day.setAttribute('aria-label', (isToday ? '오늘' : DAY_NAMES[d.getDay()] + '요일') + ': ' + (stage ? STAGE_NAMES[stage] : '기록 없음'));

        const petCell = document.createElement('div');
        petCell.className = 'day-pet';
        if (stage) {
          const mini = petBox.querySelector('svg[data-stage="' + stage + '"]').cloneNode(true);
          mini.removeAttribute('hidden');
          mini.removeAttribute('role');
          mini.removeAttribute('aria-label');
          mini.setAttribute('aria-hidden', 'true');
          mini.setAttribute('width', '44');
          mini.setAttribute('height', '44');
          petCell.appendChild(mini);
        } else {
          const soil = document.createElement('span');
          soil.className = 'soil';
          petCell.appendChild(soil);
        }

        const label = document.createElement('span');
        label.className = 'day-label';
        label.setAttribute('aria-hidden', 'true');
        label.textContent = isToday ? '오늘' : DAY_NAMES[d.getDay()];

        day.append(petCell, label);
        daysBox.appendChild(day);
      }

      gardenCount.textContent = '활짝 핀 날 ' + fullDays + '일';
    }

    function update(fromButton) {
      const c = calc(doneInput.value, totalInput.value);
      const grew = STAGE_RANK[c.stage] > STAGE_RANK[currentStage];
      const finished = c.stage === 'flower' && currentStage !== 'flower';

      // 안내 문구
      note.className = '';
      note.textContent = '할 일을 끝낼 때마다 눌러 주세요';
      const needTotal = totalInput.value === '';
      totalInput.classList.toggle('need', !c.totalOk);
      document.getElementById('total-label').classList.toggle('need', !c.totalOk);
      if (needTotal) {
        note.className = 'hint';
        note.textContent = '링 안의 분홍 칸(?)에 오늘 할 일 개수를 적어 주세요';
      } else if (!c.totalOk) {
        note.className = 'warn';
        note.textContent = '오늘 할 일 개수는 1 이상으로 적어 주세요';
      } else if (!c.doneOk) {
        note.className = 'warn';
        note.textContent = '완료한 일은 0 이상의 정수로 적어 주세요';
      } else if (c.done > c.total) {
        note.className = 'warn';
        note.textContent = '완료한 일이 오늘 할 일보다 많아요';
      } else if (c.done === c.total) {
        note.textContent = '오늘 할 일을 모두 완료했어요!';
      }

      // 말풍선
      if (!c.totalOk) {
        bubbleText.textContent = '오늘 할 일이 몇 개야? 분홍 칸에 적어 줘!';
      } else if (grew) {
        bubbleText.textContent = '자랐다! ' + STAGE_NAMES[c.stage] + ' 단계가 됐어';
        clearTimeout(grewTimer);
        grewTimer = setTimeout(function () {
          bubbleText.textContent = pick(LINES[currentStage]);
          replay(bubble, 'pop');
        }, 1600);
      } else {
        bubbleText.textContent = pick(LINES[c.stage]);
      }

      // 링, 숫자, 단계
      const percent = Math.round(c.ratio * 100);
      ring.style.setProperty('--p', percent);
      percentText.textContent = percent + '%';
      badge.textContent = STAGE_NAMES[c.stage];
      completeButton.disabled = !(c.totalOk && c.doneOk && c.done < c.total);
      showStage(c.stage);

      // 움직임
      replay(bubble, 'pop');
      if (fromButton || grew) replay(petBox, 'bounce');
      if (grew) sparkle();
      if (finished) petalShower();

      currentStage = c.stage;
      renderGarden(c.stage, c.totalOk && c.doneOk);
    }

    completeButton.addEventListener('click', function () {
      const c = calc(doneInput.value, totalInput.value);
      if (c.totalOk && c.doneOk && c.done < c.total) {
        doneInput.value = String(c.done + 1);
        replay(completeButton, 'press');
        update(true);
        save();
      }
    });

    doneInput.addEventListener('input', function () { update(false); save(); });
    totalInput.addEventListener('input', function () { update(false); save(); });

    // ---------- 시작 ----------
    (function start() {
      const now = new Date();
      document.getElementById('date').textContent =
        (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + DAY_NAMES[now.getDay()] + '요일';

      const rec = readRecord(now);
      if (rec) {
        doneInput.value = rec.done ?? '';
        totalInput.value = rec.total ?? '';
      }
      // 처음 열 때는 효과 없이 지금 단계로 시작해요.
      currentStage = calc(doneInput.value, totalInput.value).stage;
      update(false);
    })();
  </script>
</body>
