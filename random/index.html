<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 뽑기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: #2c2c2b;
      background: #ffffff;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    .description {
      margin: 0 0 16px;
      color: #66635f;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #a8a6a2;
      border-radius: 8px;
      font: inherit;
      resize: vertical;
    }

    button {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #1769b0;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #81b7e7;
      outline-offset: 2px;
    }

    .result-box {
      margin-top: 16px;
      padding: 12px 16px;
      border: 1px solid #e6e5e3;
      border-radius: 8px;
      background: #f9f8f7;
    }

    .result-label {
      margin: 0;
      color: #66635f;
      font-size: 14px;
    }

    #result {
      margin: 4px 0 0;
      font-size: 24px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #ffffff;
        background: #191919;
      }

      .description,
      .result-label {
        color: #c4c4c4;
      }

      textarea {
        color: #ffffff;
        background: #202020;
        border-color: #999999;
      }

      .result-box {
        background: #202020;
        border-color: #666666;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>랜덤 뽑기</h1>
    <p class="description">후보를 한 줄에 하나씩 적고 버튼을 눌러 보세요.</p>

    <label for="candidates">후보 목록</label>
    <textarea id="candidates" placeholder="예)&#10;짜장면&#10;짬뽕&#10;볶음밥"></textarea>

    <button type="button" id="pick-button">뽑기!</button>

    <div class="result-box" aria-live="polite">
      <p class="result-label">결과</p>
      <p id="result">아직 뽑지 않았어요</p>
    </div>
  </main>

  <script>
    const candidatesInput = document.getElementById('candidates');
    const pickButton = document.getElementById('pick-button');
    const result = document.getElementById('result');

    pickButton.addEventListener('click', function () {
      // 줄마다 나누고, 앞뒤 공백을 지우고, 빈 줄은 빼기
      const candidates = candidatesInput.value
        .split('\n')
        .map(function (line) { return line.trim(); })
        .filter(function (line) { return line !== ''; });

      if (candidates.length === 0) {
        result.textContent = '후보를 먼저 입력해 주세요';
        return;
      }

      const randomIndex = Math.floor(Math.random() * candidates.length);
      result.textContent = candidates[randomIndex];
    });
  </script>
</body>
</html>
