<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카운트다운 타이머</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: #2c2c2b;
      background: #ffffff;
    }

    main {
      max-width: 400px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    /* 남은 시간이 작은 화면에서도 크게 보이도록 설정합니다. */
    #display {
      margin: 0 0 16px;
      text-align: center;
      font-size: clamp(40px, 14vw, 64px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #a8a6a2;
      border-radius: 8px;
      font: inherit;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      min-height: 44px;
      padding: 10px;
      border: 1px solid #a8a6a2;
      border-radius: 8px;
      background: #f0efed;
      color: #2c2c2b;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #start {
      border-color: #1769b0;
      background: #1769b0;
      color: #ffffff;
    }

    button:disabled,
    input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #81b7e7;
      outline-offset: 2px;
    }

    #message {
      min-height: 24px;
      margin: 12px 0 0;
      font-weight: 600;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #ffffff;
        background: #191919;
      }

      input {
        color: #ffffff;
        background: #202020;
        border-color: #999999;
      }

      button {
        color: #ffffff;
        background: #383836;
        border-color: #999999;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>카운트다운 타이머</h1>

    <p id="display" aria-label="남은 시간">00:00</p>

    <label for="minutes">시간 설정 (분)</label>
    <input
      id="minutes"
      type="number"
      min="1"
      max="99"
      step="1"
      placeholder="1~99분"
    >

    <div class="buttons">
      <button id="start" type="button">시작</button>
      <button id="reset" type="button">초기화</button>
    </div>

    <p id="message" role="status"></p>
  </main>

  <script>
    // 화면에서 사용할 요소를 가져옵니다.
    const minutesInput = document.getElementById("minutes");
    const display = document.getElementById("display");
    const startButton = document.getElementById("start");
    const resetButton = document.getElementById("reset");
    const message = document.getElementById("message");

    // 반복 실행을 멈추기 위한 ID와 타이머 종료 시각입니다.
    let intervalId = null;
    let endTime = null;

    // 남은 초를 MM:SS 형태로 바꾸어 보여줍니다.
    function showTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      const mm = String(minutes).padStart(2, "0");
      const ss = String(seconds).padStart(2, "0");
      display.textContent = `${mm}:${ss}`;
    }

    // 실행 상태에 따라 입력창과 시작 버튼을 켜거나 끕니다.
    function setRunning(isRunning) {
      minutesInput.disabled = isRunning;
      startButton.disabled = isRunning;
    }

    // 종료 시각과 현재 시각의 차이로 남은 시간을 계산합니다.
    function updateTimer() {
      const remainingSeconds = Math.max(
        0,
        Math.ceil((endTime - Date.now()) / 1000)
      );

      showTime(remainingSeconds);

      if (remainingSeconds === 0) {
        clearInterval(intervalId);
        intervalId = null;
        endTime = null;
        setRunning(false);
        message.textContent = "완료!";
      }
    }

    startButton.addEventListener("click", function () {
      const rawValue = minutesInput.value;
      const minutes = Number(rawValue);

      // 빈 값, 정수가 아닌 값, 범위를 벗어난 값은 시작하지 않습니다.
      if (
        rawValue === "" ||
        !minutesInput.validity.valid ||
        !Number.isInteger(minutes) ||
        minutes < 1 ||
        minutes > 99
      ) {
        message.textContent = "1~99 사이의 정수를 입력해 주세요.";
        return;
      }

      message.textContent = "";
      setRunning(true);

      // 현재 시각을 기준으로 종료 시각을 정합니다.
      endTime = Date.now() + minutes * 60 * 1000;
      showTime(minutes * 60);

      // 화면을 주기적으로 갱신합니다.
      intervalId = setInterval(updateTimer, 250);
    });

    resetButton.addEventListener("click", function () {
      // 실행 중인 타이머를 멈추고 처음 상태로 되돌립니다.
      clearInterval(intervalId);
      intervalId = null;
      endTime = null;

      showTime(0);
      minutesInput.value = "";
      message.textContent = "";
      setRunning(false);
    });
  </script>
</body>
</html>
